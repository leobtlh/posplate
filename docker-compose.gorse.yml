# Déploiement local / self-hosted de Gorse (open-source, gratuit).
#
# Démarrage :  docker compose -f docker-compose.gorse.yml up -d
# API :        http://localhost:8088
# Dashboard :  http://localhost:8088 (interface web intégrée)
#
# Gorse a besoin d'un cache (Redis) et d'un stockage (Postgres).
# Tu peux réutiliser ton instance Supabase Postgres en changeant GORSE_DATA_STORE.

version: "3.9"

services:
  gorse:
    image: gorse/gorse-server:latest
    container_name: gorse-server
    ports:
      - "8088:8088"
    environment:
      # Cache : Redis
      GORSE_CACHE_STORE: redis://redis:6379
      # Stockage des données : Postgres (remplace par ton URI Supabase si tu veux)
      GORSE_DATA_STORE: postgres://gorse:gorse@postgres:5432/gorse?sslmode=disable
      # Clé d'API optionnelle pour sécuriser l'accès REST
      # GORSE_API_KEY: change-me
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  worker:
    image: gorse/gorse-worker:latest
    container_name: gorse-worker
    environment:
      GORSE_CACHE_STORE: redis://redis:6379
      GORSE_DATA_STORE: postgres://gorse:gorse@postgres:5432/gorse?sslmode=disable
      # Le worker entraîne les modèles de recommandation périodiquement
      GORSE_JOBS: recommend
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gorse-redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: gorse-postgres
    environment:
      POSTGRES_USER: gorse
      POSTGRES_PASSWORD: gorse
      POSTGRES_DB: gorse
    volumes:
      - gorse-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  gorse-postgres-data:
