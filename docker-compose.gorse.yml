# Déploiement local / self-hosté de Gorse (open-source, gratuit).
#
# Démarrage :  docker compose -f docker-compose.gorse.yml up -d
# API :        http://localhost:8087
# Dashboard :  http://localhost:8087 (interface web intégrée)
#
# Gorse a besoin d'un cache (Redis) et d'un stockage (Postgres).
# Tu peux réutiliser ton instance Supabase Postgres en changeant GORSE_DATA_STORE.

services:
  # gorse-in-one combine le serveur (master + API HTTP) et le worker
  gorse:
    image: zhenghaoz/gorse-in-one:latest
    container_name: gorse
    ports:
      # 8086 = gRPC (interne, pas besoin de l'exposer)
      # 8088 = HTTP (dashboard + API REST)
      - "8088:8088"
    environment:
      # Cache : Redis
      GORSE_CACHE_STORE: redis://redis:6379
      # Stockage des données : Postgres (remplace par ton URI Supabase si tu veux)
      GORSE_DATA_STORE: postgres://gorse:gorse@postgres:5432/gorse?sslmode=disable
      # Clé d'API optionnelle pour sécuriser l'accès REST
      # GORSE_API_KEY: change-me
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    container_name: gorse-redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: gorse-postgres
    environment:
      POSTGRES_USER: gorse
      POSTGRES_PASSWORD: gorse
      POSTGRES_DB: gorse
    volumes:
      - gorse-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  gorse-postgres-data: